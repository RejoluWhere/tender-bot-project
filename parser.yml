name: Daily Tender Parser & Notifier

on:
  schedule:
    # Запускать каждый день в 5 утра по UTC (8 утра по МСК)
    - cron: '0 5 * * *' 
  workflow_dispatch: 
    # Это добавит кнопку "Запустить вручную" на GitHub
    
jobs:
  parse-and-notify:
    runs-on: ubuntu-latest # Бесплатный сервер от GitHub
    steps:
      - name: 1. Скачать код из репозитория
        uses: actions/checkout@v4
        
      - name: 2. Настроить Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: 3. Установить все "запчасти" (библиотеки)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: 4. Запустить "Грузчика" и "Рассылку"!
        run: python parser.py
        env:
          # ИСПРАВЛЕНО: Передаем ВСЕ 4 ключа
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}